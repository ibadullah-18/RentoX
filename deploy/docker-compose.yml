# The whole site on one server. Run from this folder:
#
#   cp .env.example .env        (then fill in every value in .env)
#   docker compose build
#   docker compose up -d
#
# What runs:
#   caddy    the front door: HTTPS (certificates by themselves), the two domains, security headers
#   web      the website
#   api      the API (the mobile app talks to it directly through its own domain)
#   worker   push notifications and listing clean-up
#   migrate  runs once on every start and brings the database up to date, then stops
#   postgres the database       redis   live connections and presence (nothing important is kept in it)
#   backup   every night: database + images -> encrypted copy in Cloudflare R2 (see README.md)

name: rentox

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rentox
      POSTGRES_USER: rentox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentox -d rentox"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../backend
      target: migrate
      args:
        SIXLABORS_LICENSE_KEY: ${SIXLABORS_LICENSE_KEY:?set SIXLABORS_LICENSE_KEY in .env}
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-Release}
    # The bundle starts the configuration of the API to find the database model, so it needs the same settings.
    environment:
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=rentox;Username=rentox;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      Otp__HashingKey: ${OTP_HASHING_KEY:?set OTP_HASHING_KEY in .env}
    command:
      - "--connection"
      - "Host=postgres;Port=5432;Database=rentox;Username=rentox;Password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../backend
      target: api
      args:
        SIXLABORS_LICENSE_KEY: ${SIXLABORS_LICENSE_KEY:?set SIXLABORS_LICENSE_KEY in .env}
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-Release}
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=rentox;Username=rentox;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      Otp__HashingKey: ${OTP_HASHING_KEY:?set OTP_HASHING_KEY in .env}
      IdentitySeed__SuperAdminPhoneNumber: ${SUPER_ADMIN_PHONE:?set SUPER_ADMIN_PHONE in .env}
      Storage__RootPath: /data/storage
      # Error tracking (optional): the address (DSN) from Sentry or GlitchTip. Empty = nothing is sent.
      Sentry__Dsn: ${SENTRY_DSN:-}
    volumes:
      - uploads:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ../backend
      target: worker
      args:
        SIXLABORS_LICENSE_KEY: ${SIXLABORS_LICENSE_KEY:?set SIXLABORS_LICENSE_KEY in .env}
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-Release}
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=rentox;Username=rentox;Password=${POSTGRES_PASSWORD}"
      Storage__RootPath: /data/storage
      # The Firebase service account file (push notifications), mounted below. Leave PushNotifications off until it exists.
      PushNotifications__Enabled: ${PUSH_ENABLED:-false}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
    volumes:
      - uploads:/data/storage
      - ./secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../web
      args:
        API_BASE_URL: http://api:8080
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      TZ: Asia/Baku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
    volumes:
      # Read-write only so that "restore.sh files" can put the images back; the backup itself only reads.
      - uploads:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
